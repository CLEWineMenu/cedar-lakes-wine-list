<style>
/* Layout: a printed wine list made operable. Sticky controls over sections of ruled rows, price flush right. */
:root{
  --bg:#F1F4F0; --surface:#FAFBF9; --ink:#15231D; --muted:#5E6E66; --rule:#D3DBD4;
  --cedar:#2D4A3C; --cedar-ink:#F1F4F0; --wine:#7A2636; --warn:#8A6D1F;
  --serif:'Libre Caslon Display','Iowan Old Style',Georgia,serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --ink:#E7EDE8; --muted:#92A399; --rule:#273530;
  --cedar:#8FBBA4; --cedar-ink:#0F1713; --wine:#E08A9A; --warn:#D2B35E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --ink:#E7EDE8; --muted:#92A399; --rule:#273530;
  --cedar:#8FBBA4; --cedar-ink:#0F1713; --wine:#E08A9A; --warn:#D2B35E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:920px;margin:0 auto}
header{padding-block:36px 20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font:400 clamp(34px,6vw,52px)/1.05 var(--serif);margin:0;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:16px 0 0;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-block:1px solid var(--rule);display:grid;gap:10px}
.row1{display:flex;flex-wrap:wrap;gap:10px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 220px}
select{flex:0 1 190px}
:focus-visible{outline:2px solid var(--cedar);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:5px}
.chip[aria-pressed=true]{background:var(--cedar);color:var(--cedar-ink);border-color:var(--cedar)}
.chip[aria-pressed=true] .n{color:inherit;opacity:.75}
.opts{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--cedar);width:16px;height:16px}
.legend{margin-left:auto;display:flex;gap:16px}
.copy{font:inherit;font-size:13px;color:var(--cedar);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h2{font:400 26px/1.1 var(--serif);margin:34px 0 4px;display:flex;align-items:baseline;gap:12px}
h2 small{font:400 13px var(--sans);color:var(--muted)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.bin{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.name{font-weight:500;overflow-wrap:anywhere}
.name .v{font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.meta{grid-column:2;color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.price{grid-column:3;grid-row:1;text-align:right;font:500 18px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{grid-column:3;grid-row:2;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.out{opacity:.62}
.out .tag{color:var(--warn)}
.sect{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:13px;max-width:62ch}
footer p{margin:0 0 8px}
@media (max-width:520px){li{grid-template-columns:34px minmax(0,1fr) auto;gap:3px 10px}.legend{margin-left:0}select{flex:1 1 100%}}
</style>

<header>

  <div class="chips" id="chips"></div>
</div>
<main id="out" aria-live="polite"></main>
</div>

const CATS=[["S","Sparkling"],["W","White"],["P","Rosé"],["R","Red"],["D","Dessert & Fortified"]];
const catName=Object.fromEntries(CATS);
const $=id=>document.getElementById(id);
const fmt=n=>"$"+n.toLocaleString("en-US");
const state={cat:"all",q:"",sort:"sec"};
try{const s=JSON.parse(localStorage.getItem("clw")||"{}");if(["sec","pa","pd","na"].includes(s.sort))state.sort=s.sort}catch(e){}
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function base(){return DATA.filter(w=>w.q>0&&(!state.q||norm([w.n,w.d,w.v,w.b,catName[w.c]].join(" ")).includes(norm(state.q))))}
function view(){
  let r=base().filter(w=>state.cat==="all"||w.c===state.cat);
  const by={pa:(a,b)=>a.p-b.p,pd:(a,b)=>b.p-a.p,na:(a,b)=>norm(a.n).localeCompare(norm(b.n))};
  if(state.sort==="sec")r.sort((a,b)=>CATS.findIndex(c=>c[0]===a.c)-CATS.findIndex(c=>c[0]===b.c)||a.p-b.p);
  else r.sort(by[state.sort]);
  return r;
}
function item(w,tagCat){
  const bits=[w.d,w.s].filter(Boolean).map(esc).join("</span><span>");
  return `<li><span class="bin">${w.b?esc(w.b):"—"}</span>
  <span class="name">${esc(w.n)}${w.v?`<span class="v">${w.v}</span>`:""}</span>
  <span class="price">${fmt(w.p)}</span>
  <span class="meta">${bits?`<span>${bits}</span>`:""}${tagCat?`<span class="sect">${catName[w.c]}</span>`:""}</span>
  </li>`}
function render(){
  const r=view(),b=base();
  $("chips").innerHTML=[["all","All"],...CATS].map(([k,l])=>{const n=k==="all"?b.length:b.filter(w=>w.c===k).length;return `<button class="chip" type="button" data-c="${k}" aria-pressed="${state.cat===k}">${l}<span class="n">${n}</span></button>`}).join("");
  let h="";
  if(!r.length)h='<p class="empty">No wines match. Clear the search or change the category.</p>';
  else if(state.sort==="sec"){
    for(const [k,l] of CATS){const g=r.filter(w=>w.c===k);if(!g.length)continue;
      h+=`<h2>${l}</h2><ul>${g.map(w=>item(w,false)).join("")}</ul>`}
  }else h=`<ul style="margin-top:20px">${r.map(w=>item(w,true)).join("")}</ul>`;
  $("out").innerHTML=h;
  $("q").value=state.q;$("sort").value=state.sort;
  try{localStorage.setItem("clw",JSON.stringify({sort:state.sort}))}catch(e){}
}
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(c){state.cat=c.dataset.c;render()}};
$("q").oninput=e=>{state.q=e.target.value;render();$("q").focus()};
$("sort").onchange=e=>{state.sort=e.target.value;render()};
state.q="";state.cat="all";render();

const SHEET_KEY="cle_wine_csv_url_v2";
const DEFAULT_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRtZS70OqriyODgRFLFVVBhX2HSTYeaGoG339bQ4dLbvlz_I3ybP7ZASQR_LQkvdJJJmc-VgInI5SyU/pub?gid=108172862&single=true&output=csv';
function parseCSV(text){
 const rows=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"'){quoted=false}else field+=ch}
  else if(ch==='"')quoted=true;
  else if(ch===','){row.push(field);field=""}
  else if(ch==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field=""}
  else field+=ch;
 }
 if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}
 return rows;
}
async function syncSheet(){
 const url=(localStorage.getItem(SHEET_KEY)||DEFAULT_URL);
 if(!url)return;
 const status=$("syncStatus");status.textContent="Refreshing from Google Sheets…";
 try{
  const response=await fetch(url+(url.includes('?')?'&':'?')+'refresh='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const rows=parseCSV(await response.text());
  const keys=['Category','Bin','Wine','Vintage','Region','Bottle Size','Price','Stock'];
  if(!rows.length||!keys.every((k,i)=>(rows[0][i]||'').replace(/^\uFEFF/,'').trim().replace(/^Stock \(Bottles\)$/i,'Stock')===k))throw new Error('Unexpected CSV headings');
  const codes={'Sparkling':'S','White':'W','Rosé':'P','Red':'R','Dessert & Fortified':'D'};
  const updated=rows.slice(1).filter(r=>r.length>=8&&r[2]?.trim()).map(r=>({
   c:codes[r[0]?.trim()],b:r[1]||'',n:r[2]||'',v:r[3]||'',d:r[4]||'',s:r[5]==='750 ml'?'':(r[5]||''),p:Number((r[6]||'').replace(/[$,]/g,'')),q:Number((r[7]||'').replace(/,/g,''))
  })).filter(w=>w.c&&Number.isFinite(w.p)&&Number.isFinite(w.q)&&w.q>0);
  DATA=updated;render();status.textContent='Live sheet connected · updated '+new Date().toLocaleTimeString();
 }catch(e){status.textContent='Sheet refresh failed · '+e.message+' · showing last loaded list';console.warn('Wine sheet:',e)}
}
$("connectSheet").onclick=()=>{
 const current=localStorage.getItem(SHEET_KEY)||DEFAULT_URL;
 const url=prompt('Paste the published Google Sheets CSV URL. Clear it to disconnect:',current);
 if(url===null)return;
 if(url.trim()&&!/^https:\/\//i.test(url.trim())){alert('Please enter an HTTPS published CSV URL.');return}
 if(url.trim())localStorage.setItem(SHEET_KEY,url.trim());else localStorage.removeItem(SHEET_KEY);
 if(!url.trim()){syncSheet();return}
 syncSheet();
};
syncSheet();setInterval(syncSheet,60000);
